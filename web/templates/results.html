<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados del Extracto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Movimientos Detectados</h1>
            <a href="/" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">Subir otro</a>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 border-b border-slate-200">
                        <th class="p-4 font-semibold text-slate-600">Fecha</th>
                        <th class="p-4 font-semibold text-slate-600">Descripción</th>
                        <th class="p-4 font-semibold text-slate-600">Categoría</th>
                        <th class="p-4 font-semibold text-slate-600 text-right">Monto</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    {{ range .Movements }}
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 text-slate-500 whitespace-nowrap">{{ .Date.Format "2006-01-02" }}</td>
                        <td class="p-4 text-slate-700 font-medium">{{ .Description }}</td>
                        <td class="p-4">
                            <span class="px-3 py-1 rounded-full text-xs font-semibold 
                                {{ if eq .Type "income" }} bg-green-100 text-green-700 {{ else }} bg-blue-100 text-blue-700 {{ end }}">
                                {{ .CategoryName }}
                            </span>
                        </td>
                        <td class="p-4 text-right font-bold {{ if eq .Type "income" }} text-green-600 {{ else }} text-red-600 {{ end }}">
                            $ {{ printf "%.2f" .Amount }}
                        </td>
                    </tr>
                    {{ end }}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
