<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados del Extracto</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        function eliminarFila(btn){
            const row = btn.closest("tr")
            row.remove()
        }
    </script>

</head>

<body class="bg-slate-50 p-8">

<div class="max-w-6xl mx-auto">

    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800">Movimientos Detectados</h1>
        <a href="/" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
            Subir otro
        </a>
    </div>

<form method="POST" action="/save-movements">

<div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">

<table class="w-full text-left border-collapse">

<thead>
<tr class="bg-slate-100 border-b border-slate-200">
<th class="p-4 font-semibold text-slate-600">Fecha</th>
<th class="p-4 font-semibold text-slate-600">Descripción</th>
<th class="p-4 font-semibold text-slate-600">Categoría</th>
<th class="p-4 font-semibold text-slate-600 text-right">Monto</th>
<th class="p-4 font-semibold text-slate-600 text-center">Acción</th>
</tr>
</thead>

<tbody class="divide-y divide-slate-100">

{{ range $index, $m := .Movements }}

<tr class="hover:bg-slate-50 transition">

<td class="p-4 text-slate-500 whitespace-nowrap">

{{ $m.Date.Format "2006-01-02" }}

<input type="hidden" name="movements[{{$index}}].date" value="{{ $m.Date.Format "2006-01-02" }}">

</td>

<td class="p-4">

<input
type="text"
name="movements[{{$index}}].description"
value="{{ $m.Description }}"
class="w-full border rounded-lg p-2 text-slate-700"
/>

</td>

<td class="p-4">


<select
name="movements[{{$index}}].category_id"
class="w-full border rounded-lg p-2">

<option value="1" {{ if eq $m.CategoryID 1 }}selected{{ end }}>
Restaurante/Comida/Supermercado
</option>

<option value="2" {{ if eq $m.CategoryID 2 }}selected{{ end }}>
Ropa/Calzado
</option>

<option value="3" {{ if eq $m.CategoryID 3 }}selected{{ end }}>
Salud/Deporte
</option>

<option value="4" {{ if eq $m.CategoryID 4 }}selected{{ end }}>
Servicios/Suscripciones
</option>

<option value="5" {{ if eq $m.CategoryID 5 }}selected{{ end }}>
Transporte
</option>

<option value="6" {{ if eq $m.CategoryID 6 }}selected{{ end }}>
Viajes
</option>

<option value="7" {{ if eq $m.CategoryID 7 }}selected{{ end }}>
Educación
</option>

<option value="8" {{ if eq $m.CategoryID 8 }}selected{{ end }}>
Entretenimiento
</option>

<option value="9" {{ if eq $m.CategoryID 9 }}selected{{ end }}>
Hogar/Alquiler
</option>

<option value="10" {{ if eq $m.CategoryID 10 }}selected{{ end }}>
Salario
</option>

<option value="11" {{ if eq $m.CategoryID 11 }}selected{{ end }}>
Otros Ingresos
</option>

<option value="12" {{ if eq $m.CategoryID 12 }}selected{{ end }}>
Otros Gastos
</option>

</select>


</td>

<td class="p-4 text-right font-bold {{ if eq $m.Type "income" }} text-green-600 {{ else }} text-red-600 {{ end }}">

$ {{ printf "%.2f" $m.Amount }}

<input type="hidden" name="movements[{{$index}}].amount" value="{{ $m.Amount }}">
<input type="hidden" name="movements[{{$index}}].type" value="{{ $m.Type }}">

</td>

<td class="p-4 text-center">

<button
type="button"
onclick="eliminarFila(this)"
class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">

Eliminar

</button>

</td>

</tr>

{{ end }}

</tbody>

</table>

</div>

<div class="mt-6 flex justify-end">

<button
type="submit"
class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 font-semibold">

Guardar Movimientos

</button>

</div>

</form>

</div>

</body>
</html>
