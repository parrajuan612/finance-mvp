<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas MVP | Carga de Extractos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
<div class="bg-indigo-600 w-12 h-12 rounded-lg flex items-center justify-center mx-auto mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
</div>
            <h1 class="text-2xl font-bold text-slate-800">Finanzas Personales</h1>
            <p class="text-slate-500 text-sm mt-1">Sube tu extracto bancario para categorizar tus gastos</p>
        </div>

        <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-5">
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Archivo del Extracto (PDF)</label>
                <input type="file" name="file" required
                    class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-200 rounded-lg p-2 cursor-pointer transition">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Entidad Bancaria</label>
                <select name="bank_id" required
                    class="w-full px-4 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-slate-700">
                    <option value="" disabled selected>Selecciona un banco</option>
                    <option value="1">Bancolombia</option>
                    <option value="2">Nu Bank</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Clave del PDF</label>
                <input type="password" name="password" placeholder="••••••••"
                    class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                <p class="text-[10px] text-slate-400 mt-1 italic">* Solo si el archivo está protegido</p>
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-[0.98]">
                Procesar Extracto
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400">MVP v1.0 • Seguro y Privado</p>
        </div>
    </div>

</body>
</html>
